services:

  # -------------------------
  # OPAL SERVER (event bus)
  # -------------------------
  opal-server:
    image: permitio/opal-server:latest
    ports:
      - "7002:7002"
    environment:
      OPAL_BROADCAST_URI: redis://redis:6379
      OPAL_POLICY_REPO_URL: file:///repo
      OPAL_POLICY_REPO_MAIN_BRANCH: main
      OPAL_POLICY_REPO_POLLING_INTERVAL: 5
    volumes:
      - /Users/hi03138/tefiros/yang-policy-pap/policies-repo:/repo

  # -------------------------
  # REDIS
  # -------------------------
  redis:
    image: redis:7

  # -------------------------
  # FINANCE OPA
  # -------------------------
  opa-finance:
    image: openpolicyagent/opa:latest
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
    ports:
      - "8181:8181"


  # -------------------------
  # HR OPA
  # -------------------------
  opa-hr:
    image: openpolicyagent/opa:latest
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
    ports:
      - "8182:8181"


  # -------------------------
  # OPAL CLIENT FINANCE
  # -------------------------
  opal-client-finance:
    image: permitio/opal-client:latest
    environment:
      OPAL_SERVER_URL: http://opal-server:7002
      OPAL_INLINE_OPA_ENABLED: "false"
      OPAL_POLICY_STORE_TYPE: OPA
      OPAL_POLICY_STORE_URL: http://opa-finance:8181
      OPAL_POLICY_REPO_URL: file:///repo
      OPAL_POLICY_SUBSCRIPTION_DIRS: "domains/finance/policies"
    volumes:
      - /Users/hi03138/tefiros/yang-policy-pap/policies-repo:/repo


  # -------------------------
  # OPAL CLIENT HR
  # -------------------------
  opal-client-hr:
    image: permitio/opal-client:latest
    environment:
      OPAL_SERVER_URL: http://opal-server:7002
      OPAL_INLINE_OPA_ENABLED: "false"
      OPAL_POLICY_STORE_TYPE: OPA
      OPAL_POLICY_STORE_URL: http://opa-hr:8181
      OPAL_POLICY_REPO_URL: file:///repo
      OPAL_POLICY_SUBSCRIPTION_DIRS: "domains/hr/policies"
    volumes:
      - /Users/hi03138/tefiros/yang-policy-pap/policies-repo:/repo
