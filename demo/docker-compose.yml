services:

  # -------------------------
  # OPAL SERVER (event bus)
  # -------------------------
  opal-server:
    image: permitio/opal-server:latest
    ports:
      - "7002:7002"
    environment:
      OPAL_BROADCAST_URI: redis://redis:6379
      OPAL_POLICY_REPO_URL: file:///repo
      OPAL_POLICY_REPO_MAIN_BRANCH: main
      OPAL_POLICY_REPO_POLLING_INTERVAL: 5
    volumes:
      - /Users/hi03138/tefiros/yang-policy-pap/policies-repo:/repo

  # -------------------------
  # REDIS
  # -------------------------
  redis:
    image: redis:7

  # -------------------------
  # OPA 1
  # -------------------------
  opa-1:
    image: openpolicyagent/opa:latest
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
    ports:
      - "8181:8181"


  # -------------------------
  # OPA 2
  # -------------------------
  opa-2:
    image: openpolicyagent/opa:latest
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
    ports:
      - "8182:8181"


  # -------------------------
  # OPAL CLIENT 1
  # -------------------------
  opal-client-1:
    image: permitio/opal-client:latest
    environment:
      OPAL_SERVER_URL: http://opal-server:7002
      OPAL_INLINE_OPA_ENABLED: "false"
      OPAL_POLICY_STORE_TYPE: OPA
      OPAL_POLICY_STORE_URL: http://opa-1:8181
      OPAL_POLICY_REPO_URL: file:///repo
      OPAL_POLICY_SUBSCRIPTION_DIRS: "areas/example/server-dmz-layer1/policies"
    volumes:
      - /Users/hi03138/tefiros/yang-policy-pap/policies-repo:/repo


  # -------------------------
  # OPAL CLIENT 2
  # -------------------------
  opal-client-2:
    image: permitio/opal-client:latest
    environment:
      OPAL_SERVER_URL: http://opal-server:7002
      OPAL_INLINE_OPA_ENABLED: "false"
      OPAL_POLICY_STORE_TYPE: OPA
      OPAL_POLICY_STORE_URL: http://opa-2:8181
      OPAL_POLICY_REPO_URL: file:///repo
      OPAL_POLICY_SUBSCRIPTION_DIRS: "areas/example/server-dmz-layer2/policies"
    volumes:
      - /Users/hi03138/tefiros/yang-policy-pap/policies-repo:/repo
